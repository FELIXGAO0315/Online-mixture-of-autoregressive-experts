[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omar"
version = "1.0.0"
description = "Online mixture of autoregressive experts: learning to gate Levinson-Durbin predictors (ECE685D final project)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["omar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
